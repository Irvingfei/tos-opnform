# OpnForm 应用自带 nginx 配置（独立实例，不占用系统 nginx）
# 监听 ${OPNFORM_HTTP_PORT}（默认 18080，由构建时注入；supervisor 通过 -g 覆盖）
# 路由逻辑沿用 OpnForm 官方 docker/nginx.conf：/ -> Nuxt client，/(api|open|local/temp|forms/assets) -> Laravel

worker_processes 1;
error_log /usr/local/opnform/logs/nginx-error.log warn;
# pid 由 supervisor 通过 -g 注入（data/run/nginx.pid）

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /usr/local/opnform/logs/nginx-access.log;
    client_max_body_size 64m;
    sendfile on;
    keepalive_timeout 65;

    map $request_uri $api_uri {
        ~^/api(/.*$) $1;
        default $request_uri;
    }

    server {
        listen 18080;
        server_name _;

        location / {
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        # Nuxt 图标接口也走 client
        location ^~ /api/_nuxt_icon/ {
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location ~ /(api|open|local/temp|forms/assets)/ {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9001;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/local/opnform/api/public/index.php;
            fastcgi_param REQUEST_URI $api_uri;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
            fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        }

        # OAuth 发现路由须先于隐藏文件拒绝规则到达 Laravel
        location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource(/mcp)?)$ {
            rewrite ^ /index.php last;
        }

        location ~ /\. {
            deny all;
        }
    }
}
